name: 每日数据更新与网站部署

on:
  schedule:
    # UTC 21:42 = 北京时间 05:42 = 新西兰夏令时 10:42，每天自动运行
    - cron: "42 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取汇率与机票数据
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_data.py

      - name: 提交数据更新
        run: |
          git config user.name "middle-earth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖并构建网站
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
